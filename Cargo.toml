[package]
name = "srv-3270"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1"
chrono = "0.4.45"
clap = { version = "4.6.7", features = ["derive"] }
ebcdic = "0.1.2"
#rust3270 = { version = "0.90.0", path = "../rust3270" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
keepass = { version = "0.15", features = ["save_kdbx4"] }
percent-encoding = "2.3.2"
reqwest = { version = "0.13.5", features = ["json", "query"] }
